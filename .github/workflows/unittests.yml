name: CI 

on: 
  push: 
    # Add task-1 here so the tests run while you work!
    branches: [main, task-1] 
  pull_request: 
    branches: [main] 

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: "3.11"
          # This helps speed up your workflow
          cache: 'pip' 

      - name: Install dependencies
        run: pip install -r requirements.txt 

      # Only keep flake8 if you have actually installed it in requirements.txt
      # If not, comment it out so the build doesn't fail
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=88 

      - name: Run tests
        run: pytest tests/ -v --tb=short